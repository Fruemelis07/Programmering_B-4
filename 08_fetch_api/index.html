<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web template with p5.js</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css"
        integrity="sha512-EZLkOqwILORob+p0BXZc+Vm3RgJBOe1Iq/0fiI7r/wJgzOFZMlsqTa29UEl6v6U6gsV4uIpsNZoV32YZqrCRCQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
</head>

 <body>

    <main>
        <section class="page show" id="page1">

            <div class="area dealer-area">
                <h2>Dealer</h2>
                <div id="dealer-total"></div>
                <div class="cards" id="dealer-cards"></div>
            </div>

          
            <div class="area player-area">
                <h2>Player</h2>
                <div id="player-total"></div>
                <div class="cards" id="player-cards"></div>

                <div class="controls">
                    <button id="playerDrawBtn">Hit</button>
                    <button id="playerStandBtn">Stand</button>
                </div>
            </div>

            <div class="bet-area">
                <h3 id="balance-display">Balance: 1000</h3>

                <div class="chips">
                    <div class="chip" data-værdi="5">5</div>
                    <div class="chip" data-værdi="10">10</div>
                    <div class="chip" data-værdi="25">25</div>
                    <div class="chip" data-værdi="100">100</div>
                </div>

                <button id="placeBetBtn">Start Round</button>
                <p id="current-bet">Bet: 0</p>
            </div>

        </section>

  
        <section class="page" id="page2">
            <h1 id="result"></h1>
            <button id="restartBtn">Play Again</button>
        </section>

    </main>

</body>
